<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar al panel — Admin</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="admin-shell">
  {% with mensajes = get_flashed_messages() %}
    {% if mensajes %}
      <div class="container" style="padding-top:1rem;">
        <ul class="flashes">
          {% for mensaje in mensajes %}<li class="flash">{{ mensaje }}</li>{% endfor %}
        </ul>
      </div>
    {% endif %}
  {% endwith %}

  <div class="admin-login-box">
    <h1>Panel de administración</h1>
    <form method="post">
      <div class="campo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" autofocus>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
    </form>
    <p style="margin-top:1.4rem;"><a href="{{ url_for('portada') }}" style="font-size:0.85rem; color: var(--ink-soft);">← Volver a la tienda</a></p>
  </div>
</body>
</html>
