<script>
/* Formularios: * en lo obligatorio, aclaración arriba y en rojo lo que falta */
(function () {
  function etiquetas() {
    document.querySelectorAll('.tn-form label').forEach(function (lab) {
      if (lab.classList.contains('tn-check') || lab.dataset.tnEt) return;
      if (!lab.querySelector('input, select, textarea')) return;
      lab.dataset.tnEt = '1';
      var nodo = lab.firstChild;
      while (nodo && nodo.nodeType === 3 && !nodo.textContent.trim()) nodo = nodo.nextSibling;
      if (!nodo || nodo.nodeType !== 3) return;
      var et = document.createElement('span');
      et.className = 'tn-et';
      et.textContent = nodo.textContent.replace(/\s+$/, '');
      var marca = document.createElement('span');
      marca.className = 'tn-req';
      marca.textContent = ' *';
      marca.setAttribute('aria-hidden', 'true');
      et.appendChild(marca);
      lab.replaceChild(et, nodo);
    });
  }
  function marcas() {
    document.querySelectorAll('.tn-et').forEach(function (et) {
      var campo = et.parentNode.querySelector('input, select, textarea');
      var m = et.querySelector('.tn-req');
      if (m) m.hidden = !(campo && campo.required);
    });
  }
  function preparar() {
    etiquetas();
    marcas();
    document.querySelectorAll('form.tn-form').forEach(function (f) {
      if (f.dataset.tnNota || f.querySelectorAll('label [required]').length < 2) return;
      f.dataset.tnNota = '1';
      var p = document.createElement('p');
      p.className = 'tn-nota-req';
      p.innerHTML = '<span class="tn-req">*</span> obligatorio';
      f.insertBefore(p, f.firstChild);
    });
  }
  window.tnPreparar = preparar;
  /* Horario: el botón se enciende recién con día, hora y cancha completos */
  function estadoHorario(f) {
    var b = f.querySelector('.tn-guardar-horario');
    if (!b) return;
    var listo = Array.prototype.every.call(f.querySelectorAll('[required]'), function (c) { return c.value.trim() !== ''; });
    b.classList.toggle('tn-apagado', !listo);
    b.textContent = listo ? 'Guardar horario' : 'Completá día, hora y cancha';
  }
  function horarios() { document.querySelectorAll('form.tn-horario').forEach(estadoHorario); }
  ['input', 'change'].forEach(function (ev) {
    document.addEventListener(ev, function (e) { var f = e.target.form; if (f && f.classList.contains('tn-horario')) estadoHorario(f); }, true);
  });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', horarios); else horarios();
  function limpiar(e) {
    var c = e.target;
    if (c.classList && c.classList.contains('tn-falta') && c.checkValidity()) c.classList.remove('tn-falta');
  }
  document.addEventListener('invalid', function (e) {
    var c = e.target;
    c.classList.add('tn-falta');
    var f = c.form;
    if (f && !f.querySelector('.tn-aviso-falta')) {
      var a = document.createElement('p');
      a.className = 'tn-aviso-falta';
      a.textContent = 'Faltan datos: completá los campos marcados en rojo.';
      f.insertBefore(a, f.firstChild);
    }
  }, true);
  document.addEventListener('input', limpiar, true);
